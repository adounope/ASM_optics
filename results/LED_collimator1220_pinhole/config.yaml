# config.yaml
# all units in μm
simulation:
  λ: 620e-3   # 532e-3 μm = 532 nm
  resolution: [600, 600, 2] #Nx, Ny, Nz
  # simulation ra1200nge (in micron) (aperture file will be fitted to this xy range)
  range: [-150, 150, -150, 150, 0, 2e3] # x_start, x_end, y_start, y_end, z_start, z_end
  z_batch_size: 4
  num_process: 6 # number of parallel computing workers
save:
  # simulation range that are saved (in micron)
  range: [-150, 150, -150, 150] # x_start, x_end, y_start, y_end range to save (in unit μm)

path:
  E: ./E/LED_collimator1220_pinhole
  results: ./results/LED_collimator1220_pinhole
  aperture: ./aperture/tmp # image in _sample is zoomed and zero_padded to increase ASM simulation accuracy

plot:
  N_ticks: [10, 10, 8]


